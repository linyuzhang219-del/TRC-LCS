name: Bug report
description: Report a reproducible problem in TRC-LCS
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe what went wrong.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible example you can.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TRC-LCS version
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.11

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Ubuntu 22.04 / Windows 11 / macOS

  - type: textarea
    id: logs
    attributes:
      label: Logs or traceback
      description: Paste relevant logs or error messages here.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before opening this report.
          required: true
        - label: I can reproduce the issue with the latest version.
          required: false

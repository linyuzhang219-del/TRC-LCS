name: Feature request
description: Suggest an improvement or new capability for TRC-LCS
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TRC-LCS.

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this feature solve?
      placeholder: Describe the use case or limitation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any workarounds or alternative designs?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples, links, screenshots, or related papers if useful.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement this feature.
          required: false

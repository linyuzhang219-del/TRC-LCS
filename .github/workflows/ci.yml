name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system OpenCV dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Install package
        run: python -m pip install -U pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check trc_lcs tests tools --select E9,F63,F7,F82

      - name: Test
        run: pytest

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trc-lcs"
version = "0.1.0"
description = "Task-Relation Conditioned Loop Closure Scheduling for task-aware and embodied SLAM."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TRC-LCS Contributors"}]
keywords = ["slam", "loop-closure", "robotics", "embodied-ai", "place-recognition", "semantic-slam"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "tqdm>=4.64",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "build>=1.2",
]

[project.scripts]
trc-lcs = "trc_lcs.cli:main"

[tool.setuptools.packages.find]
include = ["trc_lcs*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
